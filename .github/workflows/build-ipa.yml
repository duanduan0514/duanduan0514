name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - shell: bash
        run: |
          set -o pipefail
          xcodebuild -project WorkshopLedger.xcodeproj -scheme WorkshopLedger -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' DEVELOPMENT_TEAM='' build | tee build.log
      - shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/WorkshopLedger.app
          test -d "$APP"
          lipo -info "$APP/WorkshopLedger" | grep -q arm64
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WorkshopLedger-iOS-arm64-unsigned.ipa Payload
          shasum -a 256 WorkshopLedger-iOS-arm64-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorkshopLedger-iOS-arm64-unsigned
          path: |
            WorkshopLedger-iOS-arm64-unsigned.ipa
            SHA256SUMS.txt
