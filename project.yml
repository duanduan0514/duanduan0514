name: WorkshopLedger
options:
  bundleIdPrefix: com.workshop
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_ENTITLEMENTS: ""
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"

targets:
  WorkshopLedger:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: WorkshopLedger
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workshop.ledger.native
        PRODUCT_NAME: WorkshopLedger
        INFOPLIST_FILE: WorkshopLedger/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  WorkshopLedger:
    build:
      targets:
        WorkshopLedger: all
    run:
      config: Debug
    archive:
      config: Release